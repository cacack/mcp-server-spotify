[project]
name = "mcp-server-spotify"
version = "0.1.0"
description = "MCP server for surgical Spotify playlist editing (search, create, add/remove/reorder tracks)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Chris Clonch", email = "chris@theclonchs.com" }]
dependencies = [
    # mcp 2.x renamed FastMCP to MCPServer and removed mcp.server.fastmcp,
    # which server.py imports. Capped until the v2 migration lands.
    "mcp[cli]>=1.2.0,<2",
    "spotipy>=2.24.0",
]

[project.scripts]
mcp-server-spotify = "mcp_server_spotify.server:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.16.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_spotify"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "acceptance: end-to-end tests that hit the live Spotify API (require credentials; opt in with --run-acceptance)",
]
addopts = "--strict-markers"
